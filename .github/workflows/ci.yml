# Secure SDLC — 階段 5 / Gate G5（持續整合）
# 把 PM 訂的三維度 Exit Criteria（功能 / 品質 / 資安）編成會擋 build 的 gate。
# 任一 job 紅燈即未過 G5；門檻沿用 待修改.md，不在此放寬。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # 維度：功能 + 品質 —— 單元測試 + QR 反解端到端驗證
  test:
    name: 功能/品質 — 測試與反解驗證
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 語法檢查（產品碼可編譯）
        run: |
          find src main.js preload.js -name "*.js" -print0 \
            | xargs -0 -I{} node --check {}
      - name: 單元測試（通過率須 100%）
        run: npm test
      - name: QR 反解端到端驗證（7 條，證明可被掃描器讀回）
        run: npm run verify

  # 維度：資安 —— 相依套件 CVE（Critical/High 擋 build）
  sca:
    name: 資安 — 相依套件弱點掃描（SCA）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 產生 lockfile（僅解析、不下載二進位）
        run: npm install --package-lock-only
      - name: npm audit — high 以上即擋 build
        run: npm audit --audit-level=high

  # 維度：資安 —— 硬編碼密鑰（任何命中擋 build）
  # 直接執行 gitleaks 二進位掃描檔案，gate = 實際掃描結果。
  # 不用 gitleaks-action wrapper，以免其 SARIF artifact 上傳受 Actions
  # 儲存配額影響而在「無密鑰」時仍紅燈（假性失敗）。
  secret-scan:
    name: 資安 — 密鑰掃描
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gitleaks/gitleaks:latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks（掃描工作區檔案，命中即擋 build）
        run: gitleaks dir . --no-banner --redact --exit-code=1

  # 維度：資安 —— SAST 引擎 ①（Semgrep，Critical/High 擋 build）
  # 只掃「出貨的產品程式碼」：排除 test/（非出貨、含測試用 eval）與
  # src/vendor/（第三方 MIT 內嵌碼），對齊資安 Exit Criteria 的範圍。
  sast:
    name: 資安 — 靜態分析 SAST①（Semgrep）
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep（OWASP Top 10 規則集，僅產品碼）
        run: |
          semgrep --error --severity=ERROR \
            --config=p/owasp-top-ten \
            --exclude=test --exclude=src/vendor --exclude=node_modules \
            src main.js preload.js

  # 維度：資安 —— SAST 引擎 ②（CodeQL，與 Semgrep 雙引擎交叉驗證）
  # 多語言全專案掃描：JavaScript/TypeScript + Python（scripts）+ GitHub Actions。
  # 私有 repo 未啟用 GitHub Advanced Security，故不上傳 code scanning，
  # 改以 upload:false 產出 SARIF（每語言一份）、自行解析，有任何發現即擋 build。
  codeql:
    name: 資安 — 靜態分析 SAST②（CodeQL 全專案）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: CodeQL 初始化（JS/TS + Python + Actions）
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python,actions
          config-file: ./.github/codeql/codeql-config.yml
      - name: CodeQL 分析（本地產出 SARIF，不上傳）
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: codeql-out
      - name: 依 CodeQL 發現決定是否擋 build（彙總各語言 SARIF）
        shell: bash
        run: |
          shopt -s nullglob
          files=(codeql-out/*.sarif)
          if [ ${#files[@]} -eq 0 ]; then echo "找不到 CodeQL SARIF 輸出"; exit 1; fi
          total=0
          for sarif in "${files[@]}"; do
            n=$(python3 -c "import json; d=json.load(open('$sarif')); print(sum(len(r.get('results',[])) for r in d.get('runs',[])))")
            echo "  $(basename "$sarif")：$n 發現"
            total=$((total + n))
          done
          echo "CodeQL 總發現數：$total"
          if [ "$total" -gt 0 ]; then
            echo "::error::CodeQL 偵測到 $total 項問題"
            for sarif in "${files[@]}"; do
              python3 -c "import json; d=json.load(open('$sarif')); [print('-', x.get('ruleId'), '::', x.get('message',{}).get('text','')) for r in d.get('runs',[]) for x in r.get('results',[])]"
            done
            exit 1
          fi
          echo "CodeQL：全語言皆無發現。"

  # 維度：資安 —— SCA 來源 ②（Google OSV.dev，與 npm audit 交叉驗證）
  # 以 scripts/osv-check.py 直接查詢 OSV.dev API（只用 Python 標準函式庫），
  # 不下載、不執行任何外部二進位；偵測到弱點或查詢失敗即非零退出、擋 build。
  osv:
    name: 資安 — 相依套件掃描 SCA②（OSV.dev）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSV.dev（掃 lockfile，偵測到弱點即擋 build）
        run: python3 scripts/osv-check.py package-lock.json

  # 全部 gate 綠燈 = 過 G5（SAST 雙引擎、SCA 雙來源皆需通過）
  gate-g5:
    name: Gate G5 — 三維度 Exit Criteria 全數達標
    needs: [test, sca, osv, secret-scan, sast, codeql]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ G5 通過：功能/品質/資安三維度 CI gate 全數綠燈（SAST 雙引擎、SCA 雙來源）。"
