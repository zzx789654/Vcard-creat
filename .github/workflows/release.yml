# Secure SDLC — 階段 6 / Gate G6（持續交付）
#
# 桌面應用的 CD 對應（誠實調整）：
#   本專案是「完全離線的 Electron 桌面程式」，沒有伺服器 Staging / 線上 E2E /
#   正式流量健康檢查，因此 cd-pipeline 的「Staging→Smoke→E2E→部署→健康檢查」
#   對應為桌面情境的等效步驟：
#     - 交付物（artifact）＝ Windows 安裝檔（NSIS）與免安裝版（portable）
#     - 「部署」＝ 把安裝檔發佈為 GitHub Release 供使用者下載
#     - 「Smoke Test」＝ 打包前先在 CI 重跑 test + 反解驗證（沿用 G5 gate）
#     - 「人工審核 Gate」＝ 推版本 tag 或手動觸發這個動作本身即人工放行點
#     - 「健康檢查」＝ electron-builder 打包成功 + artifact 完整產出
#
# 觸發兩種方式：
#   1. 推送 v 開頭的版本 tag（例如 v1.0.0）。
#   2. 手動於 Actions 頁面觸發（workflow_dispatch），輸入版本號。
#      手動觸發時由 action-gh-release 以 GITHUB_TOKEN 經 GitHub API 建立 tag，
#      不需 git tag push 權限。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本 tag（例如 v1.0.0）"
        required: true
        default: "v1.0.0"

permissions:
  contents: write   # 發佈 Release / 建立 tag 需要

jobs:
  # 打包前先重跑 G5 的功能/品質 gate（Smoke Test 等效）
  smoke:
    name: 打包前煙霧測試（重跑測試 + 反解驗證）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 版本號一致性檢查（tag 須等於 package.json 的 version）
        # 防止從錯誤分支打包：舊分支的 package.json 版本不同，會在這裡被擋下，
        # 不會產出版本號不符的安裝檔，也不會建立指向舊程式碼的標籤。
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$pkg  ref=$GITHUB_REF  sha=$GITHUB_SHA"
          if [ "$TAG" != "$pkg" ]; then
            echo "::error::版本 $TAG 與 package.json 的 $pkg 不符，請確認是從 main 觸發，且已更新 package.json 版本號"
            exit 1
          fi
      - run: npm test
      - run: npm run verify

  # 在 Windows runner 上打包並直接發佈 Release（= 桌面 app 的「部署上線」）。
  # 打包與發佈合併在同一 job，安裝檔以「Release 資產」上傳，
  # 不經 actions/upload-artifact，避免 Actions 儲存配額造成發佈失敗。
  build-and-publish:
    name: 建置 Windows 安裝檔並發佈 Release
    needs: smoke
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安裝相依（含 electron 建置工具）
        run: npm install
      - name: 打包（NSIS 安裝檔 + portable 免安裝版）
        # --publish never：electron-builder 只打包，不自行發佈。
        # 偵測到 CI 時它會嘗試 implicit publish 而要求 GH_TOKEN，
        # 這裡明確關閉，發佈統一交給下一步的 action-gh-release。
        run: npm run build -- --publish never
      - name: 建立 Release 並附上安裝檔
        uses: softprops/action-gh-release@v2
        with:
          # tag 推送時用該 tag；手動觸發時用輸入的版本號（此時由 API 建立 tag）
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          # 標籤一律建在「本次打包的 commit」上。未指定時 GitHub 會改用 repo 預設分支，
          # 預設分支不是 main 時，標籤會指向與安裝檔不符的舊程式碼。
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.blockmap
          generate_release_notes: true
